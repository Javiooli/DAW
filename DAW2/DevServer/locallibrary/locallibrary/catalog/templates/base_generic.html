<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalLibrary</title>
  <style>
    :root {
      --bg: #dce9f2;
      --card: #f5f7fb;
      --text: #0f1b2d;
      --accent: #0f65e5;
      --line: #d8deea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg), #cfe0ee);
      min-height: 100vh;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
      gap: 24px;
      padding: 24px;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 27, 45, 0.12);
      align-self: start;
    }

    .menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .menu a {
      display: block;
      text-decoration: none;
      font-weight: 700;
      color: #154fa8;
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .menu a:hover {
      color: var(--accent);
    }

    .content {
      background: rgba(255, 255, 255, 0.78);
      border-radius: 12px;
      padding: 36px;
      box-shadow: 0 8px 24px rgba(15, 27, 45, 0.1);
    }

    h1 {
      color: var(--accent);
      margin-top: 0;
      font-size: clamp(2rem, 3vw, 3rem);
    }

    h2 {
      margin-top: 28px;
      font-size: 2rem;
    }

    .stats {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      font-size: 1.2rem;
    }

    .stat-row:last-child {
      border-bottom: 0;
    }

    .badge {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      min-width: 34px;
      text-align: center;
      font-weight: 700;
      padding: 3px 10px;
    }

    .listing {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .listing li {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .menu a {
        font-size: 1.1rem;
      }

      .content {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <ul class="menu">
        <li><a href="{% url 'index' %}">Inici</a></li>
        <li><a href="{% url 'books' %}">Tots els llibres</a></li>
        <li><a href="{% url 'authors' %}">Tots els autors</a></li>
      </ul>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
