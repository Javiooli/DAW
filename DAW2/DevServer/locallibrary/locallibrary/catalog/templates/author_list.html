{% extends "base_generic.html" %}

{% block content %}
<h1>Tots els autors</h1>

{% if author_list %}
  <ul class="listing">
    {% for author in author_list %}
      <li>{{ author.first_name }} {{ author.last_name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>No hi ha autors registrats.</p>
{% endif %}
{% endblock %}
